pattern_name: context_by_anatomy

pattern_iri: https://github.com/Active-Animals/Ontology/patterns/context_by_anatomy

description: |-
  This pattern captures subdivisions of contexts by the anatomical parts involved.

  Examples:
  - cloacal-popping sound: Sound modality that involves the vent.
  - mouth incubation: Incubation caring that involves the mouth.

contributors:
  - https://orcid.org/0000-0002-4277-2151

classes:
  context_behaviour: ACTAN:0000751
  anatomical_entity: UBERON:0001062

relations:
  has_participant: RO:0000057

vars:
  context: "'context_behaviour'"
  anatomy: "'anatomical_entity'"

name:
  text: "%s"
  vars:
    - context

def:
  text: "%s that involves %s."
  vars:
    - context
    - anatomy

equivalentTo:
  text: "%s and 'has_participant' some %s"
  vars:
    - context
    - anatomy
