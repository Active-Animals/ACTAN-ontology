pattern_name: activity_by_material

pattern_iri: https://github.com/Active-Animals/Ontology/patterns/activity_by_material

description: |-
  This pattern captures subdivisions of activities by the material involved.

  Examples:
  - dust anointment: Anointment technic that involves soil.
  - web-building construction: Construction technic that involves silk.

contributors:
  - https://orcid.org/0000-0002-4277-2151

classes:
  activity_behaviour: ACTAN:0000078
  material_entity: BFO:0000040

relations:
  has_participant: RO:0000057

vars:
  activity: "'activity_behaviour'"
  material: "'material_entity'"

name:
  text: "%s"
  vars:
    - activity

def:
  text: "%s that involves %s."
  vars:
    - activity
    - material

equivalentTo:
  text: "%s and 'has_participant' some %s"
  vars:
    - activity
    - material
