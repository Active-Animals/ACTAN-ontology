pattern_name: activity_by_characteristic

pattern_iri: https://github.com/Active-Animals/Ontology/patterns/activity_by_characteristic

description: |-
  This pattern captures subdivisions of activities by their characteristics.

  Examples:
  - adhesion kinetics: Kinetics activity that involves adhesivity.
  - chromatics colouration: Colouration activity that involves chromatic property.

contributors:
  - https://orcid.org/0000-0002-4277-2151

classes:
  activity_behaviour: ACTAN:0000078
  characteristic: PATO:0000001

relations:
  has_quality: RO:0000086

vars:
  activity: "'activity_behaviour'"
  characteristic: "'characteristic'"

name:
  text: "%s"
  vars:
    - activity

def:
  text: "%s that involves %s."
  vars:
    - activity
    - characteristic

equivalentTo:
  text: "%s and 'has_quality' some %s"
  vars:
    - activity
    - characteristic
