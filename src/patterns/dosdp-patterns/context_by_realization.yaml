pattern_name: context_by_realization

pattern_iri: https://github.com/Active-Animals/Ontology/patterns/context_by_realization

description: |-
  This pattern captures context behaviours which are best differentiated by what they realize.

  Examples:
  - caring breeding: Breeding context that realizes a role.
  - feigning deception: Deception manipulation that realizes compensation switch.

contributors:
  - https://orcid.org/0000-0002-4277-2151

classes:
  context_behaviour: ACTAN:0000751
  realizable_entity: BFO:0000017

relations:
  realizes: BFO:0000055

vars:
  context: "'context_behaviour'"
  realization: "'realizable_entity'"

name:
  text: "%s"
  vars:
    - context

def:
  text: "%s that realizes %s."
  vars:
    - context
    - realization

equivalentTo:
  text: "%s and 'realizes' some %s"
  vars:
    - context
    - realization
