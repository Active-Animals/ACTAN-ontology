pattern_name: disposition_in_history

pattern_iri: https://github.com/Active-Animals/Ontology/patterns/disposition_in_history

description: |-
  This pattern captures dispositions which have more historically had traction than now, although they may not necessarily be defunct. They do not need to be deprecated, since they are not substantially misrepresented.

  Examples:
  - 'instinct initiator'
  - 'consummatory initiator'

contributors:
  - https://orcid.org/0000-0002-4277-2151

classes:
  disposition: BFO:0000016

relations: {}

annotationProperties:
  comment: rdfs:comment

vars:
  history: "'disposition'"
  
name:
  text: "%s"
  vars:
    - disposition

annotations:
  - annotationProperty: comment
    text: "This term is part of a historical ethological perspective."
