pattern_name: disposition_in_individuals
 
pattern_iri: https://github.com/Active-Animals/Ontology/patterns/disposition_in_individuals
 
description: |-
  A disposition that is characteristic of an individual organism.

  Example:
  - natatorial mode: Locomotion-mode that is characteristic of an organism.
  - jet pattern: Gait pattern that is characteristic of an organism.
 
contributors:
  - https://orcid.org/0000-0002-4277-2151
 
classes:
  behavioural_disposition: BCIO:050416
  organism: COB:0000022
 
relations:
  characteristic of: RO:0000052
 
vars:
  parent: "'behavioural_disposition'"
 
data_vars:
  label: xsd:string
  definition: xsd:string
 
name:
  text: "%s"
  vars:
    - label
 
def:
  text: "%s"
  vars:
    - definition
 
subClassOf:
  text: "%s that is characteristic of an organism."
  vars:
    - parent
