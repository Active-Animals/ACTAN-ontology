pattern_name: context_by_material

pattern_iri: https://github.com/Active-Animals/Ontology/patterns/context_by_material

description: |-
  This pattern captures context behaviours which are best differentiated by the material involved.

  Examples:
  - air expiration: Expiration respiration that involves air.
  - parenting caring: Caring breeding that involves family.

contributors:
  - https://orcid.org/0000-0002-4277-2151

classes:
  context_behaviour: ACTAN:0000751
  material_entity: BFO:0000040

relations:
  has_participant: RO:0000057
  
vars:
  context: "'context_behaviour'"
  material: "'material_entity'"

name:
  text: "%s"
  vars:
    - context

def:
  text: "%s that involves %s."
  vars:
    - context
    - material

equivalentTo:
  text: "%s and 'has_participant' some %s"
  vars:
    - context
    - material
