pattern_name: disposition_in_groups
 
pattern_iri: https://github.com/Active-Animals/Ontology/patterns/disposition_in_groups

description: |-
  A disposition that is characteristic of a collection of organisms.

  Example:
  - mill formation: collective-formation that is characteristic of a collection of organisms.
  - community membership: group-membership that is characteristic of a collection of organisms.
 
contributors:
  - https://orcid.org/0000-0002-4277-2151
 
classes:
  behavioural_disposition: BCIO:050416
  collection_of_organisms: PCO:0000000
 
relations:
  characteristic of: RO:0000052
 
vars:
  parent: "'behavioural_disposition'"
 
data_vars:
  label: xsd:string
  definition: xsd:string
 
name:
  text: "%s"
  vars:
    - label
 
def:
  text: "%s"
  vars:
    - definition
 
subClassOf:
  text: "%s that is characteristic of a collection of organisms."
  vars:
    - parent
