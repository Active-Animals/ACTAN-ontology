pattern_name: p_locomotor_gait

pattern_iri: https://github.com/Active-Animals/Ontology/patterns/p_locomotor_gait

description: |-
  This pattern captures locomotor gaits, defined by the locomotion modes and patterns that they realize, supplemented by the particular kinematic and kinetic activities that are involved.

  Examples:
  - anchor-probe gait: Burrowing-gait that realizes the limbless mode, and the peristalsis pattern, by using a probing movement with pull kinetics.
  - aquatic-lateral-undulating gait: Swimming-gait that realizes the BCF mode, and the lateral-undulation pattern, by using a bending movement with thrust kinetics.

contributors:
  - https://orcid.org/0000-0002-4277-2151

classes:
  locomotion_positioning: ACTAN:0000176
  locomotion-mode: ACTAN:0000010
  gait_pattern: ACTAN:0000126
  kinematics_activity: ACTAN:0000747
  kinetics_activity: ACTAN:0000147

relations:
  realizes: BFO:0000055
  has_part: BFO:0000051

vars:
  gait: "'locomotion_positioning'"
  mode: "'locomotion-mode'"
  pattern: "'gait_pattern'"
  kinematics: "'kinematics_activity'"
  kinetics: "'kinetics_activity'"

name:
  text: "%s"
  vars:
    - gait

def:
  text: "%s that realizes the %s, and the %s, by using %s with %s."
  vars:
    - gait
    - mode
    - pattern
    - kinematics
    - kinetics

equivalentTo:
  text: "%s and 'realizes' some %s and 'realizes' some %s and 'has_part' some %s and 'has_part' some %s"
  vars:
    - gait
    - mode
    - pattern
    - kinematics
    - kinetics
