pattern_name: p_locomotor_gait

pattern_iri: https://github.com/Active-Animals/Ontology/patterns/p_locomotor_gait

description: |-
  This pattern captures locomotor gaits, defined by the locomotion modes and underlying gait patterns that they realize.

  Examples:
  - anchor-probe gait: Burrowing-gait that realizes limbless mode and peristalsis pattern.
  - aquatic-lateral-undulating gait: Swimming-gait that realizes BCF mode and lateral-undulation pattern.

contributors:
  - https://orcid.org/0000-0002-4277-2151

classes:
  locomotion_positioning: ACTAN:0000176
  locomotion-mode: ACTAN:0000010
  gait_pattern: ACTAN:0000126

relations:
  realizes: BFO:0000055

vars:
  gait: "'locomotion_positioning'"
  mode: "'locomotion-mode'"
  pattern: "'gait_pattern'"
name:
  text: "%s"
  vars:
    - gait

def:
  text: "%s that realizes %s and %s."
  vars:
    - gait
    - mode
    - pattern

equivalentTo:
  text: "%s and 'realizes' some %s and 'realizes' some"
  vars:
    - gait
    - mode
    - pattern
