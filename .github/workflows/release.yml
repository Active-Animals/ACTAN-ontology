name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag of the release to attach assets to (leave blank for latest)'
        required: false
        default: ''

jobs:
  release:
    runs-on: ubuntu-latest
    container: obolibrary/odkfull:v1.6
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build release assets
        run: |
          cd src/ontology
          make prepare_release_fast ROBOT_ENV='ROBOT_JAVA_ARGS=-Xmx6G'

      - name: Determine tag
        id: vars
        run: |
          if [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          elif [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="$(git describe --tags --abbrev=0 2>/dev/null || echo '')"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Target tag: $TAG"

      - name: Attach assets to GitHub Release
        uses: softprops/action-gh-release@v2
        if: steps.vars.outputs.tag != ''
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          files: |
            actan.owl
            actan.obo
            actan.json
            actan-base.owl
            actan-base.obo
            actan-base.json
            actan-full.owl
            actan-full.obo
            actan-full.json
